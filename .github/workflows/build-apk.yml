name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Capacitor 8 (and 7) set sourceCompatibility/targetCompatibility = Java 21
      # in their Android library. Gradle must therefore run on JDK 21; a JDK 17
      # JVM fails with "invalid source release: 21". Keep the 17 setup above and
      # switch the active JDK for the Gradle build only.
      - name: Activate JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync Capacitor Android project
        env:
          LIVE_APP_URL: ${{ secrets.LIVE_APP_URL }}
        run: npx cap sync android

      - name: Point Gradle at the Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_DIR=$SDK_DIR"
          java -version
          if [ -n "$SDK_DIR" ]; then
            echo "sdk.dir=$SDK_DIR" > android/local.properties
            ls "$SDK_DIR/platforms" || true
          fi
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore

      # Artifact makes the APK downloadable even for manual workflow_dispatch runs.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindloom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
