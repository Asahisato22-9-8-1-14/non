<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe0ad">
  <meta name="description" content="StudyX — an offline study system with 49 steps, mind maps, notes, flashcards and spaced repetition. Works in airplane mode.">
  <title>StudyX</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="studyx-icon.png">
  <link rel="apple-touch-icon" href="studyx-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (no flash of the wrong colours).
    (function () {
      try {
        if (localStorage.getItem('ml.theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* storage may be unavailable; light theme still works */ }
    })();
  </script>
</head>
<body>
  <div id="studyx-splash" class="splash" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <button id="back-btn" class="icon-btn" type="button" data-action="nav-back"
                aria-label="Go back" title="Go back" hidden>←</button>
        <a class="brand" href="#/dashboard">
          <img class="brand-icon" src="studyx-icon.png" alt="">
          <span class="brand-name">StudyX</span>
          <span class="offline-badge" title="No internet needed">OFFLINE</span>
        </a>
        <button id="theme-btn" class="theme-toggle" type="button" data-action="toggle-theme"
                aria-label="Switch to dark mode" title="Switch dark / light mode">
          <span class="theme-icon">☾</span><span class="theme-label">Dark</span>
        </button>
      </div>
      <nav class="tabs" aria-label="Main navigation">
        <a href="#/guide" data-nav="guide">Guide</a>
        <a href="#/dashboard" data-nav="dashboard">Home</a>
        <a href="#/maps" data-nav="maps">Maps</a>
        <a href="#/notes" data-nav="notes">Notes</a>
        <a href="#/decks" data-nav="decks">Cards</a>
        <a href="#/settings" data-nav="settings">More</a>
      </nav>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- All scripts are local files bundled inside the APK. No CDNs, no remote
       fonts, and no network requests: this app works in airplane mode. -->
  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
